name: Build and Deploy Landing Page

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: phakade-site
  CONTAINER_NAME: phakade-site
  REMOTE_PATH: /opt/phakade-site
  HOST_PORT: "80"

permissions:
  contents: read
  packages: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Normalize registry owner
        run: echo "OWNER_LC=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"

      - name: Build and push image
        run: |
          IMAGE="${REGISTRY}/${OWNER_LC}/${IMAGE_NAME}"
          docker build \
            -t "${IMAGE}:latest" \
            -t "${IMAGE}:${GITHUB_SHA::7}" \
            .
          docker push "${IMAGE}:latest"
          docker push "${IMAGE}:${GITHUB_SHA::7}"

      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.DROPLET_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "${{ secrets.DROPLET_HOST }}" >> ~/.ssh/known_hosts

      - name: Deploy image on droplet
        run: |
          ssh "${{ secrets.DROPLET_USER }}@${{ secrets.DROPLET_HOST }}" <<EOF
          set -e
          mkdir -p "${REMOTE_PATH}"
          printf '%s' "${{ secrets.GHCR_TOKEN }}" | docker login ghcr.io -u "${{ secrets.GHCR_USERNAME }}" --password-stdin
          docker pull "${REGISTRY}/${OWNER_LC}/${IMAGE_NAME}:latest"
          docker rm -f "${CONTAINER_NAME}" >/dev/null 2>&1 || true
          docker run -d \
            --name "${CONTAINER_NAME}" \
            --restart unless-stopped \
            -p ${HOST_PORT}:80 \
            "${REGISTRY}/${OWNER_LC}/${IMAGE_NAME}:latest"
          EOF
