server {
  listen 80;
  server_name phakade.net www.phakade.net;
  root /usr/share/nginx/html;
  index index.html;

  location / {
    try_files $uri $uri/ /index.html;
  }

  location ~* \.(?:css|js|ico|png|jpg|jpeg|gif|svg|webp|json)$ {
    expires 7d;
    add_header Cache-Control "public, max-age=604800, immutable";
    try_files $uri =404;
  }
}
